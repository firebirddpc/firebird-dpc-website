[build]
publish = "."
functions = "netlify/functions"

[functions."*"]
node_bundler = "esbuild"

[[redirects]]
from = "/api/blog/posts"
to = "/.netlify/functions/blog-posts"
status = 200

[[redirects]]
from = "/api/blog/login"
to = "/.netlify/functions/blog-login"
status = 200

[[redirects]]
from = "/api/blog/logout"
to = "/.netlify/functions/blog-logout"
status = 200

[[redirects]]
from = "/api/blog/accept-invite"
to = "/.netlify/functions/blog-accept-invite"
status = 200

[[redirects]]
from = "/api/blog/admin/posts"
to = "/.netlify/functions/blog-admin-posts"
status = 200

[[redirects]]
from = "/api/blog/admin/upload"
to = "/.netlify/functions/blog-upload"
status = 200

[[redirects]]
from = "/api/blog/image/*"
to = "/.netlify/functions/blog-image/:splat"
status = 200

[[redirects]]
from = "/api/contact/submit"
to = "/.netlify/functions/contact-submit"
status = 200

[[redirects]]
from = "/api/contact/admin"
to = "/.netlify/functions/contact-admin"
status = 200

[[redirects]]
from = "/whatisdpc"
to = "/what-is-dpc"
status = 301
force = true

[[redirects]]
from = "/what-is-dpc"
to = "/dpc-crawlable.html"
status = 200
force = true

[[redirects]]
from = "/about"
to = "/about-crawlable.html"
status = 200
force = true

[[redirects]]
from = "/membership"
to = "/membership-crawlable.html"
status = 200
force = true


[[redirects]]
from = "/services"
to = "/services-crawlable.html"
status = 200
force = true


[[redirects]]
from = "/faq"
to = "/faq-crawlable.html"
status = 200
force = true


[[redirects]]
from = "/contact"
to = "/contact-crawlable.html"
status = 200
force = true

[[redirects]]
from = "/direct-primary-care-worthington-ohio"
to = "/worthington-crawlable.html"
status = 200
force = true

[[redirects]]
from = "/blog/*"
to = "/blog/article.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
